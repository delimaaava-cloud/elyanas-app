
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1877f2">
  <link rel="manifest" href="./manifest.json">
  <title>Elyanas E-System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 18px;
      width: min(90%, 400px);
      box-shadow: 0 8px 30px #00000015;
      text-align: center;
    }
    h1 { margin-bottom: 5px; }
    p { color: #65676b; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 15px;
    }
    input { border: 1px solid #ddd; }
    button {
      background: #1877f2;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    #status { font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Elyanas</h1>
    <p>E-System Employee Login</p>

    <form id="loginForm">
      <input id="employeeCode"
             placeholder="Employee Code"
             autocomplete="username" required>
      <input id="password"
             type="password"
             placeholder="Password"
             autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>

    <p id="status"></p>
  </main>

  <script>
    document.getElementById('loginForm')
      .addEventListener('submit', event => {
        event.preventDefault();
        document.getElementById('status').textContent =
          'Secure login connection is not configured yet.';
      });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .catch(console.error);
      });
    }
  </script>
</body>
</html>
